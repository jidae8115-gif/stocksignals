name: TrackRecommendations

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (=UTC 22:00 전날) — 한국장·미국장 둘 다 마감 이후
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TZ: Asia/Seoul

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Write service account key
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}' | base64 -d > service_account.json
          echo "bytes written: $(wc -c < service_account.json)"
          python -c "import json; d=json.load(open('service_account.json')); print('valid JSON, client_email =', d['client_email'])"

      - name: Run track_recommendations.py
        run: python track_recommendations.py

      - name: Commit updated log
        run: |
          git config user.name "stocksignals-bot"
          git config user.email "actions@github.com"
          git pull --rebase
          git add recommendations_log.csv
          git diff --staged --quiet || git commit -m "chore: update tracking log [skip ci]"
          git push
